# Only packages: frpc.exe + frpc.toml + open-game.html + start.bat
# Does NOT build roBrowser.
#
# Run: Actions → Package FRPC Visitor → Run workflow → download Artifacts

name: Package FRPC Visitor

on:
  workflow_dispatch:
    inputs:
      frp_version:
        description: 'frp version (no v prefix)'
        required: false
        default: '0.61.1'
      server_addr:
        description: 'frps serverAddr'
        required: false
        default: '120.26.102.118'
      server_port:
        description: 'frps serverPort'
        required: false
        default: '7000'
      auth_token:
        description: 'frps auth.token'
        required: false
        default: 'lieyaolusha'
      secret_key:
        description: 'stcp secretKey'
        required: false
        default: 'boboan'

permissions:
  contents: read

jobs:
  package:
    name: frpc + html + bat only
    runs-on: windows-latest
    steps:
      - name: Download frpc and make package
        shell: pwsh
        env:
          FRP_VERSION: ${{ inputs.frp_version }}
          FRP_SERVER_ADDR: ${{ inputs.server_addr }}
          FRP_SERVER_PORT: ${{ inputs.server_port }}
          FRP_AUTH_TOKEN: ${{ inputs.auth_token }}
          FRP_SECRET_KEY: ${{ inputs.secret_key }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = $env:FRP_VERSION
          $out = Join-Path $env:RUNNER_TEMP 'frpc-visitor-win'
          $zipDl = Join-Path $env:RUNNER_TEMP "frp_${ver}_windows_amd64.zip"
          $url = "https://github.com/fatedier/frp/releases/download/v${ver}/frp_${ver}_windows_amd64.zip"

          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zipDl
          Expand-Archive -Force -Path $zipDl -DestinationPath (Join-Path $env:RUNNER_TEMP 'frp-extract')

          $frpc = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'frp-extract') -Recurse -Filter 'frpc.exe' | Select-Object -First 1
          if (-not $frpc) { throw 'frpc.exe not found' }
          Copy-Item $frpc.FullName (Join-Path $out 'frpc.exe')

          # NO SSH / 2822 — only 8010, 5999, 3338
          $toml = @"
          serverAddr = "$($env:FRP_SERVER_ADDR)"
          serverPort = $($env:FRP_SERVER_PORT)
          auth.token = "$($env:FRP_AUTH_TOKEN)"

          [[visitors]]
          name = "ro-robrowser"
          type = "stcp"
          serverName = "robrowser"
          secretKey = "$($env:FRP_SECRET_KEY)"
          bindPort = 8010

          [[visitors]]
          name = "ro-wsproxy"
          type = "stcp"
          serverName = "wsproxy"
          secretKey = "$($env:FRP_SECRET_KEY)"
          bindPort = 5999

          [[visitors]]
          name = "ro-remote-client"
          type = "stcp"
          serverName = "remote-client"
          secretKey = "$($env:FRP_SECRET_KEY)"
          bindPort = 3338
          "@
          ($toml -split "`n" | ForEach-Object { $_ -replace '^\s+', '' }) -join "`n" |
            Set-Content -NoNewline -Encoding utf8 (Join-Path $out 'frpc.toml')
          Add-Content -Encoding utf8 (Join-Path $out 'frpc.toml') ""

          $html = @"
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
          <meta charset="UTF-8" />
          <meta http-equiv="refresh" content="0;url=http://127.0.0.1:8010/" />
          <title>打开 roBrowser</title>
          <script>location.replace('http://127.0.0.1:8010/');</script>
          </head>
          <body>
          <p>正在打开游戏…若未跳转请点击：
          <a href="http://127.0.0.1:8010/">http://127.0.0.1:8010/</a>
          </p>
          </body>
          </html>
          "@
          ($html -split "`n" | ForEach-Object { $_ -replace '^\s+', '' }) -join "`n" |
            Set-Content -Encoding utf8 (Join-Path $out 'open-game.html')

          $bat = @"
          @echo off
          cd /d "%~dp0"
          echo Starting frpc (8010 / 5999 / 3338). SSH is NOT included.
          start "" "open-game.html"
          frpc.exe -c frpc.toml
          pause
          "@
          ($bat -split "`n" | ForEach-Object { $_ -replace '^\s+', '' }) -join "`r`n" |
            Set-Content -Encoding ascii (Join-Path $out 'start.bat')

          $readme = @"
          1. Double-click start.bat
          2. Keep the window open
          3. Browser opens http://127.0.0.1:8010 via open-game.html
          Ports: 8010 robrowser, 5999 wsproxy, 3338 remote-client
          SSH is NOT included.
          "@
          ($readme -split "`n" | ForEach-Object { $_ -replace '^\s+', '' }) -join "`n" |
            Set-Content -Encoding utf8 (Join-Path $out 'README.txt')

          $tomlText = Get-Content (Join-Path $out 'frpc.toml') -Raw
          if ($tomlText -match 'aidlux_ssh|2822|name = "ssh"') {
            throw 'SSH visitor must not be packaged'
          }

          $artifactZip = Join-Path $env:RUNNER_TEMP 'frpc-visitor-win.zip'
          if (Test-Path $artifactZip) { Remove-Item $artifactZip -Force }
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $artifactZip
          Write-Host "Created $artifactZip"
          Get-ChildItem $out | Format-Table Name, Length
          "PKG_ZIP=$artifactZip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: frpc-visitor-win
          path: ${{ env.PKG_ZIP }}
          if-no-files-found: error
          retention-days: 30
