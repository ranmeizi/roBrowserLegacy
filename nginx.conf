# roBrowserLegacy — nginx 静态站点配置
#
# 用法：
#   1. 将 ROBROWSER_ROOT 改为本机 dist/Web 的绝对路径
#   2. 复制到 nginx sites-enabled，或 include 进 http {}：
#        include /path/to/roBrowserLegacy/nginx.conf;
#   3. 重载：nginx -t && nginx -s reload
#
# 可选：取消注释 WebSocket / GRF 反向代理段，与 Config.local.js 中的
# socketProxy、remoteClient 地址保持一致。

# 部署时改为实际路径，例如 /Users/boboan/code/learn/roBrowserLegacy/dist/Web
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 8010;
	server_name localhost;

	# 修改为 dist/Web 的绝对路径
	root /home/aidlux/roBrowserLegacy/dist/Web;
	index index.html;

	# 大体积 JS 包（Online.js 等约 12MB）
	client_max_body_size 64m;

	# 关闭目录浏览
	autoindex off;

	# CORS（与 Dockerfile Apache 配置一致，便于跨域加载资源）
	add_header Access-Control-Allow-Origin "*" always;

	# 静态资源缓存（含 ES Module / Web Worker）
	location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
		expires 7d;
		add_header Cache-Control "public, immutable";
		add_header Access-Control-Allow-Origin "*" always;
		try_files $uri =404;
	}

	location = /manifest.webmanifest {
		types { }
		default_type application/manifest+json;
		add_header Access-Control-Allow-Origin "*" always;
		try_files $uri =404;
	}

	# 主站：直接提供静态文件
	location / {
		try_files $uri $uri/ /index.html;
	}

	location /emblem {
    	proxy_pass http://127.0.0.1:8888;
    	proxy_set_header Host $host;
	}
	location /userconfig {
    	proxy_pass http://127.0.0.1:8888;
    	proxy_set_header Host $host;
	}
}
